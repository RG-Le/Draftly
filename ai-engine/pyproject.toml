[tool.poetry]
name = "draftly-ai-engine"
version = "0.1.0"
description = "Draftly AI Engine — Triage, Draft Generation, Profile Analysis"
authors = ["Draftly Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
celery = {extras = ["redis"], version = "^5.4.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
asyncpg = "^0.29.0"
litellm = "^1.40.0"
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
redis = "^5.0.0"
structlog = "^24.4.0"
jinja2 = "^3.1.4"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
